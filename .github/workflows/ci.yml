name: CI

# Verification matrix for omp-zvec-grep. The repo is public; the scoped
# package is published public to @artisann-studios only through the manual/tag
# publish.yml workflow, never by CI on push/PR.
#
# Runs on every branch push, on every pull request, and on demand via
# workflow_dispatch. Nothing here publishes; publishing happens only through
# the explicit publish.yml workflow.
#
# The real-zg-smoke job is intentionally manual-only (workflow_dispatch): it
# needs the real pinned upstream zg CLI, and future index-building assertions
# would download a local embedding model on first build. A skipped job is not
# a result — these lanes are untested until GitHub actually runs them.

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    verify:
        name: Verify (${{ matrix.os }})
        strategy:
            fail-fast: false
            matrix:
                # ubuntu-latest = Linux x64; macos-15 = GitHub-hosted Apple Silicon
                # (arm64). See docs.github.com hosted-runner reference.
                os: [ubuntu-latest, macos-15]
        runs-on: ${{ matrix.os }}
        steps:
            - name: Check out candidate
              uses: actions/checkout@v6

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2

            - name: Install frozen dependencies
              run: bun install --frozen-lockfile

            - name: Run typecheck, lint, and format check
              run: bun run check

            - name: Run hermetic default test suite (fake zg, no network)
              run: bun test

            - name: Run hermetic integration suites
              run: bun run test:integration

            - name: Validate packed contents and install (shared script)
              run: bun scripts/validate-pack.mjs

    real-zg-smoke:
        name: Real zg CLI smoke (manual)
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - name: Check out candidate
              uses: actions/checkout@v6

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2

            - name: Set up Node for the zg CLI runtime
              # @zvec/zvec-grep@0.2.1 declares engines.node >= 22; the CLI runs on
              # Node (bin zg -> dist/cli/index.js), so pin an explicit Node here.
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x

            - name: Install frozen dependencies
              run: bun install --frozen-lockfile

            - name: Install pinned upstream zg CLI (zvec-grep 0.2.1)
              # The real zvec-grep CLI from the upstream zvec-ai repo, pinned.
              run: npm install -g @zvec/zvec-grep@0.2.1

            - name: Run explicit real-CLI contract smoke
              run: bun run test:cli
