name: Release validation (manual, no publish)

# Read-only release-candidate validation for @artisann-studios/omp-zvec-grep.
# It validates a candidate end to end (typecheck/lint/format, hermetic
# integration suites, tag/version agreement, real pack + out-of-tree install)
# and never runs `npm publish`; publication happens only through the explicit
# manual/tag publish.yml workflow (restricted, org-private). This workflow
# requests no npm token and stays read-only.
#
# Run manually on a branch or tag via
# Actions -> "Release validation (manual, no publish)" -> Run workflow.
# When run on a tag, the tag must equal `v<package.json version>`.

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    validate:
        name: Validate release candidate
        runs-on: ubuntu-latest
        steps:
            - name: Check out candidate
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2

            - name: Install frozen dependencies
              run: bun install --frozen-lockfile

            - name: Run typecheck, lint, and format check
              run: bun run check

            - name: Run hermetic integration suites (no real zg, no network, no skips)
              run: bun run test:integration

            - name: Validate packed contents and install (shared script)
              env:
                  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
              run: bun scripts/validate-pack.mjs --tag "$RELEASE_TAG"
